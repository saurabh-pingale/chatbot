# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c5321cbc8d5febf2640dc5edb558a0ff"
name = "chatbot-test"
application_url = "https://bot.reezoai.com"
embedded = true

[webhooks]
api_version = "2025-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_metaobjects,read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[access.admin]
direct_api_mode = "offline"

[auth]
redirect_urls = [
  "https://bot.reezoai.com/auth/callback",
  "https://bot.reezoai.com/auth/shopify/callback",
  "https://bot.reezoai.com/api/auth/callback"
]

[app_proxy]
url = "https://bot.reezoai.com"
subpath = "chatbot-api-1"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
