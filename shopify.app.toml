client_id = "5c6356e63895028f5c0c531b2f8c9846"
name = "Reezo AI"
application_url = "https://bot.reezoai.com"
embedded = true
handle = "reezo-ai-1"

[webhooks]
api_version = "2026-01"

[access_scopes]
