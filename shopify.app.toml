# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "cf18231712db608526c917dad536a85a"
name = "chatbot"
handle = "chatbot-234"
application_url = "https://postage-rica-hopefully-pre.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2025-04"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products"

[auth]
redirect_urls = [
  "https://postage-rica-hopefully-pre.trycloudflare.com/auth/callback",
  "https://postage-rica-hopefully-pre.trycloudflare.com/auth/shopify/callback",
  "https://postage-rica-hopefully-pre.trycloudflare.com/api/auth/callback"
]

[app_proxy]
url = "https://postage-rica-hopefully-pre.trycloudflare.com"
subpath = "chatbot-api"
prefix = "apps"

[pos]
embedded = false
