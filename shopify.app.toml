# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7a74b677148771413acd5519c8c0f796"
name = "chatbot-custom"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access.admin]
direct_api_mode = "offline"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_metaobjects,read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://bot.reezoai.com/auth/callback",
  "https://bot.reezoai.com/auth/shopify/callback",
  "https://bot.reezoai.com/api/auth/callback"
]

[app_proxy]
url = "https://bot.reezoai.com"
subpath = "chatbot-api-1"
prefix = "apps"
