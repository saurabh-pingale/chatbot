# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fab4900a3724527ae0a17f1055fef198"
name = "Cognito Bot"
application_url = "https://bot.cognitoinnovations.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access.admin]
direct_api_mode = "offline"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_metaobjects,read_orders,read_products,write_products"

[auth]
redirect_urls = [
  "https://bot.cognitoinnovations.com/auth/callback",
  "https://bot.cognitoinnovations.com/auth/shopify/callback",
  "https://bot.cognitoinnovations.com/api/auth/callback"
]
