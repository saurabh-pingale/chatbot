<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Page</title>
    <link rel="stylesheet" href="../../chatbot.css">
</head>
<body>
    <div id="chat-container">
        <div id="chat-page" class="chat-page">

            <!-- Chat Header -->
            <div class="chatbot-header-glass" id="chat-header">
                <!-- Chat Header LOGO -->
                <div class="chatbot-header-left">
                    <img id="chat-logo" src="" alt="Logo" class="chatbot-logo" />
                    <h3 class="chatbot-header-title" id="chat-title"></h3>
                </div>
                <!-- Chat Header -->

                <!-- Cart Icon -->
                <div id="cart-icon" class="chatbot-cart-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count">0</span>
                </div>
                <!-- Cart Icon -->

            </div>
            <!-- Chat Header -->

            <!-- Messages -->
            <div class="chat-content">
                <div class="message-list" id="message-list"></div>
            </div>
            <!-- Messages -->

            <!-- Query Slider -->
            <div class="user-query-slider" id="query-slider"></div>

            <!-- Input -->
            <div class="input-component">
                <textarea class="input-box" placeholder="Type your message..." rows="1" maxlength="200"></textarea>
                <button class="send-button" disabled>Send</button>
            </div>
            <!-- Input -->

            <!-- Cart -->
            <div class="cart-drawer">

                <!-- Cart Header -->
                <div class="cart-drawer-header">
                    <h3 class="cart-drawer-title">Added to Cart</h3>
                    <button class="cart-drawer-close">×</button>
                </div>
                <!-- Cart Header -->

                <!-- Cart Content -->
                <div class="cart-drawer-content"></div>

                <!-- Checkout Button -->
                <button class="checkout-button">Checkout</button>
            </div>
            <!-- Cart -->

        </div>
    </div>

    <script src="ChatPage.js"></script>
</body>
</html>
