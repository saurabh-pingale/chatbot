<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Gate</title>
    <link rel="stylesheet" href="../../chatbot.css">
</head>
<body>
    <div id="email-gate-container" class="email-gate-page">
        <div class="chatbot-header" id="email-gate-header">
            <img id="email-gate-logo" alt="Logo" class="chatbot-logo" />
            <h3 class="chatbot-header-title" id="email-gate-title"></h3>
        </div>
        <div class="email-collection-content">
            <p>
                To get started with our chat assistant, please enter your email address. This helps us 
                personalize your experience
            </p>
            <input 
                type="email" 
                class="email-input" 
                placeholder="Your email address" 
                required
                aria-label="Email address"
                aria-describedby="email-error"
            >
            <div id="email-error" class="error-message hidden">Please enter a valid email address</div>
            <button class="start-chat-button" id="start-chat-btn">Continue to Chat</button>
            <button class="skip-button" id="skip-btn">Continue as Guest</button> 
        </div>
    </div>

    <script src="EmailGatePage.js"></script>
</body>
</html>
